name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Exercises the production canonical/robots logic; CI never deploys.
      # SITE_URL is declared in turbo.json build env, so it also keys the
      # turbo cache — a preview build can't be replayed as production.
      SITE_URL: https://majiphaneer.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm turbo typecheck
      - run: pnpm turbo test
      - run: pnpm turbo build
      - run: node scripts/check-budgets.mjs apps/web/dist
