name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # environment-scoped secrets are invisible without declaring the
    # environment on the job.
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Guard required secrets and variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Missing secret CLOUDFLARE_API_TOKEN (environment: production)"; missing=1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID (environment: production)"; missing=1; fi
          if [ -z "$SITE_URL" ]; then echo "::error::Missing variable SITE_URL (environment: production)"; missing=1; fi
          exit $missing
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: node scripts/check-budgets.mjs apps/web/dist
      # wrangler runs directly (not via cloudflare/wrangler-action, which
      # swallows wrangler's real error messages).
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @majiphaneer/web exec wrangler deploy
